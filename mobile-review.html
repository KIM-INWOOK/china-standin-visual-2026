<!doctype html><meta charset="utf-8"><style>body{margin:0;background:#d5dbe2;font:14px sans-serif}nav{padding:12px;display:flex;gap:6px;flex-wrap:wrap}button{padding:10px}iframe{display:block;width:390px;height:844px;border:0;background:white}#result{white-space:pre-wrap;position:absolute;left:410px;top:100px}</style><nav><button onclick="resize(360,740)">360</button><button onclick="resize(390,844)">390</button><button onclick="resize(390,640)">작은 높이</button><button onclick="resize(768,1024)">768</button><button onclick="resize(1280,900)">PC</button><button onclick="check()">전체 검사</button></nav><nav id="buttons"></nav><iframe id="preview" src="mobile-preview.html"></iframe><pre id="result"></pre><script>
const frame=document.querySelector('iframe');let phoneWidth=390,phoneHeight=844;
function resize(w,h){phoneWidth=w;phoneHeight=h;frame.style.width=w+'px';frame.style.height=h+'px';Object.defineProperty(frame.contentWindow.screen,'width',{get:()=>w,configurable:true});Object.defineProperty(frame.contentWindow.screen,'height',{get:()=>h,configurable:true});frame.contentWindow.layout();}
function scene(i,p){const win=frame.contentWindow,d=win.document;win.update=()=>{};d.querySelector('#case-art').style.transition='none';d.querySelector('#story-card').style.animation='none';win.scrollTo(0,0);win.focus(i,p);d.querySelector('#case-art').classList.toggle('active',p>0);d.querySelector('#case-art').classList.add('colorful');d.querySelector('#case-art').style.setProperty('--scene-reveal','1');d.querySelector('#stage').classList.toggle('detail-view',p>0);win.layout();}
function check(){const win=frame.contentWindow,d=win.document,rows=[];for(const [w,h]of [[360,740],[390,844],[390,640],[768,1024],[1280,900]]){resize(w,h);for(let i=0;i<5;i++)for(let p=0;p<4;p++){scene(i,p);const c=d.querySelector('#story-card').getBoundingClientRect(),a=d.querySelector('#case-art').getBoundingClientRect(),sh=d.querySelector('#stage').clientHeight;rows.push({w,h,i,p,stage:sh,cardBottom:Math.round(c.bottom),artBottom:Math.round(a.bottom),font:win.getComputedStyle(d.querySelector('#story-card').firstElementChild).fontSize,overflow:c.bottom>sh-40||p>0&&a.bottom>sh-40});}}document.querySelector('#result').textContent=JSON.stringify(rows);resize(390,844);scene(0,1);}
for(let i=0;i<5;i++)for(let p=0;p<4;p++){const b=document.createElement('button');b.textContent=i+' / '+p;b.onclick=()=>scene(i,p);document.querySelector('#buttons').append(b);}frame.onload=()=>{frame.contentWindow.update=()=>{};resize(390,844);};

function ending(i,part=.25){const win=frame.contentWindow,d=win.document;win.update=()=>{};const step=d.querySelectorAll('.ending-step')[i];win.scrollTo(0,win.scrollY+step.getBoundingClientRect().top+step.offsetHeight*part-win.innerHeight*.48);win.updateEnding();document.querySelector('#result').textContent=JSON.stringify({stage:d.querySelector('.ending-stage').getBoundingClientRect().toJSON(),card:d.querySelector('#ending-card').getBoundingClientRect().toJSON(),art:d.querySelector('#ending-art').getBoundingClientRect().toJSON()});}
for(const i of [0,1,2]){const b=document.createElement('button');b.textContent='결말 '+i;b.onclick=()=>ending(i);document.querySelector('#buttons').append(b);}for(const i of [-3,-6,-4,-7,-5]){const b=document.createElement('button');b.textContent='도입 '+i;b.onclick=()=>scene(i,0);document.querySelector('#buttons').append(b);}
</script>
